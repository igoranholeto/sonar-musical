 <text x="800" y="330" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#f4f4f5" text-anchor="middle">P90</text>
 <text x="800" y="360" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#9a958d" text-anchor="middle">Meio-termo: corpo + brilho</text>
