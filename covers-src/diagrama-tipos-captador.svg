 <rect width="960" height="400" rx="16" fill="#111214" stroke="#2a2a30" stroke-width="1.5"/>
 <line x1="320" y1="70" x2="320" y2="300" stroke="#2a2a30" stroke-width="1.2"/>
 <line x1="640" y1="70" x2="640" y2="300" stroke="#2a2a30" stroke-width="1.2"/>
 <g transform="translate(160,170)"><rect x="-30" y="-96" width="60" height="192" rx="16" fill="url(#cream)" stroke="#b9ad97" stroke-width="1.5"/><circle cx="0" cy="-72" r="6.5" fill="url(#pole)" stroke="#7a7a82" stroke-width="0.8"/><circle cx="0" cy="-43" r="6.5" fill="url(#pole)" stroke="#7a7a82" stroke-width="0.8"/><circle cx="0" cy="-14" r="6.5" fill="url(#pole)" stroke="#7a7a82" stroke-width="0.8"/><circle cx="0" cy="14" r="6.5" fill="url(#pole)" stroke="#7a7a82" stroke-width="0.8"/><circle cx="0" cy="43" r="6.5" fill="url(#pole)" stroke="#7a7a82" stroke-width="0.8"/><circle cx="0" cy="72" r="6.5" fill="url(#pole)" stroke="#7a7a82" stroke-width="0.8"/></g>
