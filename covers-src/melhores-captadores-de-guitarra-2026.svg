<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Três tipos de captador de guitarra — single coil, humbucker e P90 — sobre fundo escuro com a marca Sonar Musical">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141416"/>
      <stop offset="0.6" stop-color="#0e0e10"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e63946" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#b8202d" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#090909" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f2f4"/>
      <stop offset="0.5" stop-color="#b9b9c0"/>
      <stop offset="1" stop-color="#75757e"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe9dd"/>
      <stop offset="1" stop-color="#d7cdba"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26222a"/>
      <stop offset="1" stop-color="#151318"/>
    </linearGradient>
    <radialGradient id="pole" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#e8e8ec"/>
      <stop offset="0.6" stop-color="#a9a9b1"/>
      <stop offset="1" stop-color="#6c6c74"/>
    </radialGradient>

    <!-- SINGLE COIL -->
    <g id="single">
      <ellipse cx="0" cy="118" rx="44" ry="14" fill="#000" opacity="0.35"/>
      <rect x="-30" y="-108" width="60" height="216" rx="16" fill="url(#cream)" stroke="#b9ad97" stroke-width="1.5"/>
      <g fill="url(#pole)" stroke="#7a7a82" stroke-width="0.8">
        <circle cx="0" cy="-80" r="7"/><circle cx="0" cy="-48" r="7"/><circle cx="0" cy="-16" r="7"/>
        <circle cx="0" cy="16" r="7"/><circle cx="0" cy="48" r="7"/><circle cx="0" cy="80" r="7"/>
      </g>
    </g>

    <!-- HUMBUCKER -->
    <g id="humbucker">
      <ellipse cx="0" cy="122" rx="78" ry="16" fill="#000" opacity="0.4"/>
      <rect x="-72" y="-112" width="144" height="224" rx="14" fill="url(#chrome)" stroke="#5c5c63" stroke-width="1.5"/>
      <rect x="-62" y="-102" width="124" height="204" rx="10" fill="url(#black)"/>
      <line x1="0" y1="-100" x2="0" y2="100" stroke="#0c0a0e" stroke-width="3"/>
      <!-- bobina esquerda: parafusos com fenda -->
      <g>
        <g fill="url(#pole)" stroke="#6f6f77" stroke-width="0.8">
          <circle cx="-32" cy="-78" r="8"/><circle cx="-32" cy="-47" r="8"/><circle cx="-32" cy="-16" r="8"/>
          <circle cx="-32" cy="15" r="8"/><circle cx="-32" cy="46" r="8"/><circle cx="-32" cy="77" r="8"/>
        </g>
        <g stroke="#3a3a40" stroke-width="1.6">
          <line x1="-37" y1="-78" x2="-27" y2="-78"/><line x1="-37" y1="-47" x2="-27" y2="-47"/><line x1="-37" y1="-16" x2="-27" y2="-16"/>
          <line x1="-37" y1="15" x2="-27" y2="15"/><line x1="-37" y1="46" x2="-27" y2="46"/><line x1="-37" y1="77" x2="-27" y2="77"/>
        </g>
      </g>
      <!-- bobina direita: slugs lisos -->
      <g fill="url(#pole)" stroke="#6f6f77" stroke-width="0.8">
        <circle cx="32" cy="-78" r="8"/><circle cx="32" cy="-47" r="8"/><circle cx="32" cy="-16" r="8"/>
        <circle cx="32" cy="15" r="8"/><circle cx="32" cy="46" r="8"/><circle cx="32" cy="77" r="8"/>
      </g>
    </g>

    <!-- P90 (soapbar) -->
    <g id="p90">
      <ellipse cx="0" cy="118" rx="52" ry="14" fill="#000" opacity="0.35"/>
      <rect x="-44" y="-104" width="88" height="208" rx="18" fill="url(#cream)" stroke="#b9ad97" stroke-width="1.5"/>
      <g fill="url(#pole)" stroke="#7a7a82" stroke-width="0.8">
        <circle cx="0" cy="-70" r="6.5"/><circle cx="0" cy="-42" r="6.5"/><circle cx="0" cy="-14" r="6.5"/>
        <circle cx="0" cy="14" r="6.5"/><circle cx="0" cy="42" r="6.5"/><circle cx="0" cy="70" r="6.5"/>
      </g>
      <!-- parafusos de fixação do soapbar -->
      <circle cx="0" cy="-92" r="5" fill="#8a8078" stroke="#6a6058" stroke-width="0.8"/>
      <circle cx="0" cy="92" r="5" fill="#8a8078" stroke="#6a6058" stroke-width="0.8"/>
    </g>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- grade sutil -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  <!-- Brilho radial atrás dos captadores -->
  <circle cx="905" cy="345" r="330" fill="url(#glow)"/>

  <!-- Wordmark (fiel ao logo do site) -->
  <g transform="translate(80,46)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#e63946"/>
    <g transform="translate(6,6) scale(0.92)" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3" fill="#fff" stroke="none"/>
      <circle cx="18" cy="16" r="3" fill="#fff" stroke="none"/>
    </g>
    <text x="46" y="24" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="0.3" fill="#f4f4f5">Sonar<tspan fill="#e63946">Musical</tspan></text>
  </g>

  <!-- Kicker -->
  <text x="84" y="250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="7" fill="#c9c4bd">GUIA · ACESSÓRIOS · 2026</text>
  <!-- Título -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="1">
    <text x="80" y="348" font-size="92" fill="#f4f4f5">MELHORES</text>
    <text x="80" y="440" font-size="92" fill="#e63946">CAPTADORES</text>
  </g>
  <!-- Subtítulo -->
  <text x="84" y="498" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="1" fill="#9a958d">single coil · humbucker · P90</text>

  <!-- Captadores -->
  <use href="#single" transform="translate(792,352) rotate(-9) scale(1.0)"/>
  <use href="#humbucker" transform="translate(935,330) scale(1.12)"/>
  <use href="#p90" transform="translate(1088,360) rotate(9) scale(1.0)"/>

  <!-- Rótulos dos captadores -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0.5" fill="#c9c4bd" text-anchor="middle">
    <text x="788" y="520">Single coil</text>
    <text x="935" y="548">Humbucker</text>
    <text x="1090" y="520">P90</text>
  </g>
</svg>
