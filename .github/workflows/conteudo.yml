# Regras editoriais (travessão, "testamos", CTA sem meli.la, capa sem crédito).
# Roda a cada push e PR; o deploy da Netlify não depende dele, mas o commit fica vermelho.
name: Verificar conteúdo

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/lint-conteudo.mjs
